name: Update Stock Data

on:
  workflow_dispatch:

  schedule:
    - cron: '23 11 * * 2-6'
      timezone: 'Asia/Tokyo'

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # - name: Restore Google credentials
      #   run: |
      #     printf '%s' '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
      #     printf '%s' '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Download master data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python src/download_drive_data.py

      - name: Extract price data
        run: unzip -q data/prices.zip -d data

      - name: Update price data
        env:
          STOCK_DATA_DIR: ${{ github.workspace }}/data
        run: python src/update_prices.py

      - name: Update features data
        env:
          STOCK_DATA_DIR: ${{ github.workspace }}/data
        run: python src/build_features.py

      - name: Compress updated price data
        run: |
          rm data/prices.zip
          cd data
          zip -rq prices.zip prices
          cd ..
          ls -lh data/prices.zip

      - name: Upload updated price and features data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python src/upload_drive_data.py

      