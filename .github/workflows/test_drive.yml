name: Test Google Drive

on:
  workflow_dispatch:

jobs:
  test-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Google credentials
        run: |
          printf '%s' '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          printf '%s' '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Download master data
        run: python src/download_drive_data.py

      - name: Extract price data
        run: unzip data/prices.zip -d data

      - name: Check extracted price data
        run: |
          echo "Number of price files:"
          find data/prices -type f | wc -l

          echo "First few files:"
          find data/prices -type f | sed -n '1,10p'